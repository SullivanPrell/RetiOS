# Google developer documentation style guide, enforced with Vale.
#
#   https://developers.google.com/style   (CC BY 4.0)
#
# The rules live in .vale/styles/Google, a vendored copy of the Vale-compatible
# implementation at https://github.com/vale-cli/Google.
#
# Vale reads comments from .swift files, not code — with one measured exception. It does
# not follow that code is never linted: a doc comment that cites a Python line or quotes
# the exact string a utility prints is prose to Vale, and its backticks carry no meaning
# outside Markdown. That distinction drives the per-format sections below.
#
# The exception: Vale's Swift scoping finds comments by scanning for `//`, it does not
# parse the language. A `//` inside a multi-line string literal therefore opens a comment
# that never existed, and the rest of that line is linted as prose. Acting on such a
# finding edits code, not a comment. Before committing a prose sweep run
#
#     git status --porcelain | awk '{print $NF}' | grep '\.swift$' \
#         | xargs python3 .vale/tools/verify_code_unchanged.py
#
# which strips comments from both revisions and compares what is left.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Reticulum

[*.md]
BasedOnStyles = Google
Google.Parens = NO

[*.swift]
BasedOnStyles = Google
Google.Parens = NO

# --- Deviations that apply everywhere --------------------------------------------
#
# Google.Parens ("use parentheses judiciously") fires 2456 times across the Swift
# sources of this repository family, almost entirely on the port's citation convention:
# every non-obvious behaviour names the Python line it mirrors, as `(LXMRouter.py:294)`.
# Those citations are how parity is argued and re-verified against a moving upstream, so
# the convention stays and the rule is off rather than half-obeyed.
#
# Google.Acronyms is satisfied through the Reticulum vocabulary rather than by disabling
# it: protocol terms (RNS, MTU, IFAC, HDLC, WDCL), Swift's own `// MARK:` sections, and
# ALL-CAPS enum cases quoted in prose are accepted, so the rule still catches genuinely
# unexplained initialisms in new text.

# --- Deviations specific to Swift comments ---------------------------------------
#
# Vale parses Markdown, so it knows a fenced block or a `code span` is not prose. It has
# no such parser for a Swift comment: the whole comment body is prose, backticks and all.
# Four rules are pure noise under that reading, and the Markdown side proves it — run
# against this family's .md files, where code spans *are* excluded, each scores near zero.
# Counts below are Swift/Markdown over LXMFSwift, LXSTSwift, NomadNetSwift and RetiOS.
#
#   Google.Spacing    188/0. Token '[a-z][.?!][A-Z]' matches the dot in every qualified
#                     identifier: `Handlers.LXMF` reads as a missing sentence space.
#   Google.Ellipses   39/2, and every Swift one is a code elision: `base64.b32encode(...)`,
#                     `isOnline = ...`.
#   Google.Quotes     102/5. The rule moves commas and periods inside quotation marks; the
#                     guide itself excepts literal strings, and in these comments that is
#                     nearly all of them — `"\x00",` `"leave unchanged".`. Moving the comma
#                     inside would state the wrong value.
#
# Each stays on for Markdown, where it earns its keep. Google.Units, Google.Ordinal and
# Google.OptionalPlurals scored 7, 5 and 0 here and stay on in both formats — low enough
# to fix rather than waive.
Google.Spacing = NO
Google.Ellipses = NO
Google.Quotes = NO

# --- Deviations scoped to one file each ------------------------------------------
#
# Two files carry literal text that the error-level rules cannot read as literal.
#
#   RetiOS/BLEMesh/CoreBluetoothMeshTransport.swift   Google.LyHyphens 7, Google.EmDash 1.
#                     The hyphenated names are BLE advertisement values quoted from log
#                     traces, "sully-iphone" and "Sully-iPhone", and "sully" ends in "ly",
#                     so the adverb-hyphen token matches. The em dash is inside a quoted
#                     reproduction of a reported log line. Both rules carry an `action`,
#                     and applying either would state a name the radio never broadcast.
#   RetiOSUITests/RetiOSUITests.swift                 Google.LyHyphens 1. The xcodebuild
#                     flag `-only-testing:` in the command sample the doc comment gives.

[RetiOS/BLEMesh/CoreBluetoothMeshTransport.swift]
Google.LyHyphens = NO
Google.EmDash = NO

[RetiOSUITests/RetiOSUITests.swift]
Google.LyHyphens = NO

# --- Findings left standing ------------------------------------------------------
#
# Five warnings survive a clean run and are correct prose:
#
#   Google.OxfordComma  3. CHANGELOG.md:223 and SETUP.md:51 are participial clauses and
#                README.md:134 is a contrast ("expression, not ideas or layout
#                conventions"). None is a three-item list.
#   Google.Colons  2, both TESTING.md. Line 247 is the first item of a list the colon on
#                line 245 introduces, which the guide capitalizes; line 250 quotes the
#                literal UI string "Mode: Embedded".
